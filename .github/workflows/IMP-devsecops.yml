name: IMP-DevSecOps CI/CD Pipeline

on:
    push:
        branches: ["main", "master"]
    pull_request:
        branches: ["main", "master"]
    workflow_dispatch: {}

jobs:
    # ==========================================
    # CI JOB 1: SAST Scan (Semgrep)
    # ==========================================
    sast-scan:
        name: Semgrep SAST Scan
        runs-on: ubuntu-latest
        container:
            image: semgrep/semgrep
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Run Semgrep SAST
              run: semgrep scan --config auto --error --verbose --exclude=".github"

    # ==========================================
    # CI JOB 2: Code Quality (Pylint)
    # ==========================================
    pylint-check:
        name: Pylint Code Quality Gate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install Dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install pylint
                  pip install -r requirements.txt

            - name: Run Pylint Check
              run: pylint --fail-under=9.0 app.py

    # ==========================================
    # CI JOB 3: Dependency Vulnerability Audit (SCA)
    # ==========================================
    dependency-audit:
        name: Python Dependency Security Audit
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install pip-audit
              run: |
                  python -m pip install --upgrade pip
                  pip install pip-audit
                  pip install -r requirements.txt

            - name: Run Pip Audit
              run: pip-audit --requirement requirements.txt

    # ==========================================
    # CD STAGE: Build, Deploy, Health & Upgrade Check
    # ==========================================
    deploy-to-vm:
        name: Build, Deploy & Health Check on VM
        needs: [sast-scan, pylint-check, dependency-audit]
        runs-on: self-hosted
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Build and Run Container
              run: |
                  echo "Building Docker container using IMP-Dockerfile..."
                  docker build -t secure-flask-app:latest -f IMP-Dockerfile .
                  
                  echo "Force removing existing container if present..."
                  docker rm -f web-flask || true
                  
                  echo "Running new container with restart policy..."
                  docker run -d -p 5000:5000 --name web-flask --restart unless-stopped secure-flask-app:latest

            - name: Container Health & Optimization Check
              run: |
                  echo "Checking container running state..."
                  RUNNING=$(docker inspect --format='{{.State.Running}}' web-flask)
                  if [ "$RUNNING" != "true" ]; then
                      echo "ERROR: Container is not running (broken/unhealthy)."
                      exit 1
                  fi

                  echo "Checking container exit code & restart count..."
                  EXIT_CODE=$(docker inspect --format='{{.State.ExitCode}}' web-flask)
                  RESTART_COUNT=$(docker inspect --format='{{.RestartCount}}' web-flask)
                  echo "Exit Code: $EXIT_CODE, Restart Count: $RESTART_COUNT"
                  if [ "$EXIT_CODE" != "0" ]; then
                      echo "ERROR: Container exited with error code $EXIT_CODE."
                      exit 1
                  fi

                  echo "Checking container resource statistics & optimization..."
                  docker stats web-flask --no-stream

                  echo "Checking HTTP application endpoint health..."
                  for i in {1..5}; do
                      if curl -sSf http://localhost:5000/; then
                          echo "Application is healthy and responding!"
                          exit 0
                      fi
                      echo "Waiting for application to start (attempt $i/5)..."
                      sleep 2
                  done
                  echo "ERROR: Application health check failed after 5 attempts."
                  exit 1

            - name: Container & Package Upgrade Check
              run: |
                  echo "Checking for outdated Python packages inside container..."
                  docker exec web-flask pip list --outdated || echo "No pip outdated check available or no updates needed"
                  echo "Upgrade check completed successfully."
